[project]
name = "organizador"
version = "1.0.0"
description = "Sort a folder's files into category subfolders — one-off or as a live watcher."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["watchdog>=3.0"]

[project.scripts]
organizar = "organizador.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["organizador"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
